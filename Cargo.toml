[package]
name = "keybot"
version = "0.1.0"
authors = ["MetroWind <chris.corsair@gmail.com>"]
edition = "2021"

[profile.release]
lto = true

[dependencies]
regex = ">=1"
log = ">=0.4"
env_logger = ">=0.11"
chrono = ">=0.4"
serde = { version = ">=1.0", features = ["derive"] }
serde_json = ">=1.0"
tokio = { version = "=0.2.25", features = ["macros", "rt-threaded", "time"] }
reqwest = { version = "=0.10.10", features = ["blocking", "json"] }
uuid = { version = ">=1", features = ["v1"] }
toml = ">=0.8"
telegram-bot = "=0.8.0"
futures = ">=0.3"
rand = ">=0.8"
tempfile = ">=3"
clap = ">=4"
rusqlite = ">=0.32"