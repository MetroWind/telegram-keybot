on: [push]

name: Build head

jobs:
  build:
    name: Build Binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      
      - name: Install musl tools
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          target: x86_64-unknown-linux-musl
          override: true

      - name: Build Debug Binary
        uses: actions-rs/cargo@v1
        with:
          command: build
          args: --target x86_64-unknown-linux-musl

      - name: Build Release Binary
        uses: actions-rs/cargo@v1
        with:
          command: build
          args: --release --target x86_64-unknown-linux-musl

      - name: Strip Release Binary
        run: strip target/x86_64-unknown-linux-musl/release/keybot

      - name: Upload Debug Artifact
        uses: actions/upload-artifact@v4
        with:
          name: keybot-static-debug
          path: target/x86_64-unknown-linux-musl/debug/keybot

      - name: Upload Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: keybot-static-release
          path: target/x86_64-unknown-linux-musl/release/keybot